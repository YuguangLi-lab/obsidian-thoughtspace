name: Release

on:
  push:
    tags:
      - '[0-9]*'
    branches:
      - 'release/[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'YuguangLi-lab/obsidian-thoughtspace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve release version
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$RELEASE_REF_TYPE" = branch ]; then
            echo "RELEASE_TAG=${RELEASE_REF_NAME#release/}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=$RELEASE_REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: Check release metadata and extract notes
        run: python3 scripts/check-release.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run build
      - name: Verify generated styles are committed
        run: git diff --exit-code -- styles.css
      - name: Package installer and checksums
        run: python3 scripts/package.py
      - name: Attest runtime assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            dist/thoughtspace-*.zip
            dist/SHA256SUMS.txt
      - name: Create verified release tag from release branch
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null); then
            test "$existing" = "$GITHUB_SHA" || { echo 'Release tag already points to another commit; refusing to overwrite.'; exit 1; }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi
      - name: Publish standard Obsidian assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" main.js manifest.json styles.css "dist/thoughtspace-$RELEASE_TAG.zip" dist/SHA256SUMS.txt --verify-tag --title "ThoughtSpace Whiteboard $RELEASE_TAG" --notes-file dist/release-notes.md
      - name: Verify public installer endpoints and asset contents
        run: python3 scripts/verify-release.py
